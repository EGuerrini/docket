<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docket demo</title>
<meta name="description" content="A two-minute walkthrough of docket, a job-search app built end to end: pipeline, grounding, tailoring and the person in the loop.">
<style>
  :root { --bg: #0d0f14; --fg: #e8e9ee; --muted: #9aa0ad; --accent: #6d7cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 0 20px; }
  video { width: 100%; max-height: 82vh; border-radius: 14px; background: #000; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .links { margin-top: 18px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>docket</h1>
  <p>A two-minute walkthrough, recorded on the phone.</p>
  <video src="docket-demo.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  <div class="links"><a href="https://github.com/EGuerrini/docket">How it is built: the README, examples and workflow</a></div>
</main>
</body>
</html>
